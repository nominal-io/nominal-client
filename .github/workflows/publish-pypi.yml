name: Publish PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to simulate (e.g. nominal-tdms-v1.143.1)'
        required: true
  push:
    tags:
      - "v*.*.*"
      - "*-v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
      - name: Determine package from tag
        id: package
        env:
          # Store in an environment to guard against script injection
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" == v* ]]; then
            echo "name=nominal" >> "$GITHUB_OUTPUT"
          else
            echo "name=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build package
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
        run: uv build --package "$PACKAGE"
      - name: Publish to PyPI
        if: github.event_name == 'push'
        run: uv publish --trusted-publishing always
