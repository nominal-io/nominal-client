name: Build and deploy docs site to Pages

on:
  push:
    branches: ["main"]

  pull_request:
    types: [opened, reopened, synchronize]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages,
# and to post the docs preview status on PRs
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

jobs:
  # Build job
  build:
    name: Build github pages
    runs-on: depot-ubuntu-24.04
    env:
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://renderdoc.cloudflare-admins.workers.dev/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/
    steps:
      # Each run resets the preview status, so a failed rerun can't keep an older success.
      # Fork PRs get a read-only token, and the preview does not serve them.
      - name: Mark the docs preview pending
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PREVIEW_SHA" \
            -f state=pending \
            -f context="docs preview" \
            -f description="Building the docs preview"
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          # the docs dependency group needs Python >=3.12 (Sphinx 9)
          python-version: "3.13"
      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: Install video runtime for autodoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer-plugins-bad1.0-0
      - name: Install dependencies
        run: |
          just install
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Test docstring rendering
        run: uv run --all-packages --all-extras --group docs pytest docs/_tests --no-cov
      - name: Check notebook formatting
        run: just check-format-notebooks
      - name: Install Node for navigation tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test reference bookmarks
        run: node --test docs/_tests/reference-links.test.mjs
      - name: Build docs (warnings fail the build)
        run: |
          just build-docs
      # The renderdoc Worker serves this artifact as the PR's docs preview
      - name: Upload built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: ./docs/_build/dirhtml
          # matches the Pages artifact below, so the preview link stays live for longer-running PRs
          retention-days: 30
      - name: Link the docs preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PREVIEW_SHA" \
            -f state=success \
            -f context="docs preview" \
            -f description="↗ Open the rendered docs" \
            -f target_url="$PREVIEW_URL"
      - name: Mark the docs preview failed
        if: >-
          failure() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$PREVIEW_SHA" \
            -f state=failure \
            -f context="docs preview" \
            -f description="Docs build failed, so there is no preview" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      # PRs aren't deployed and preview from docs-site, so only other builds keep a Pages upload
      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./docs/_build/dirhtml
          # kept so the developer docs hub (nominal-io/pub-docs) can pull it on its daily run
          retention-days: 30

  # Deployment job
  deploy:
    name: Deploy github pages
    # Disallow running deployment for pull requests and for forked repositories
    if: github.repository_owner == 'nominal-io' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: depot-ubuntu-24.04-small
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
