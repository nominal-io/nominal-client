name: Build and deploy docs site to Pages

on:
  push:
    branches: ["main"]

  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    name: Build github pages
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          # the docs dependency group needs Python >=3.12 (Sphinx 9)
          python-version: "3.13"
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install dependencies
        run: |
          just install
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build docs (warnings fail the build)
        run: |
          just build-docs
      # Download from the run's Artifacts to preview a PR's docs: unzip, then
      # `python -m http.server -d <dir>` (the folder-style URLs need a server).
      - name: Upload built site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./docs/_build/dirhtml
          retention-days: 7
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_build/dirhtml

  # Deployment job
  deploy:
    name: Deploy github pages
    # Disallow running deployment for pull requests and for forked repositories
    if: github.repository_owner == 'nominal-io' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: depot-ubuntu-24.04-small
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
