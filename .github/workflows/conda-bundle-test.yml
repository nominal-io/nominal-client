name: Test Conda bundle
on:
  push:
    branches: [codex/conda-release-bundle]
    paths: [.github/workflows/conda-bundle-test.yml, .github/workflows/conda-bundle.yml]
permissions:
  contents: read
jobs:
  bundle:
    uses: ./.github/workflows/conda-bundle.yml
    permissions:
      contents: write
    with:
      tag: v1.182.0
      publish: false
