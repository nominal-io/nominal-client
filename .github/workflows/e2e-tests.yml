# End-to-end tests against Nominal staging.
# Requires the E2E_NOMINAL_STAGING_API_KEY repository secret.
# The file-upload-e2e Azure leg additionally requires E2E_NOMINAL_AZURE_STAGING_API_KEY /
# E2E_NOMINAL_AZURE_STAGING_WORKSPACE_RID.

name: E2E Tests (Staging)

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["main"]
  workflow_dispatch:

# Serialize e2e runs per-ref so we don't overwhelm staging with concurrent
# test suites from the same branch.  A new push cancels the in-flight run.
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-suites:
    name: E2E Tests (${{ matrix.suite.name }})
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: core
            args: >-
              tests/e2e
              --ignore=tests/e2e/migration
              --ignore=tests/e2e/test_file_upload.py
              --ignore=tests/e2e/test_timestamps.py
              --ignore=tests/e2e/test_ingest_units.py
              --ignore=tests/e2e/test_derived_dataset.py
              --ignore=tests/e2e/test_spatial.py
          - name: ingestion
            args: tests/e2e/test_timestamps.py tests/e2e/test_ingest_units.py -n 2
          - name: derived
            args: tests/e2e/test_derived_dataset.py
          - name: spatial
            args: tests/e2e/test_spatial.py

    # Fork PRs don't have access to secrets — skip gracefully.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install dependencies
        run: just install

      - name: Write staging profile
        env:
          NOMINAL_E2E_TOKEN: ${{ secrets.E2E_NOMINAL_STAGING_API_KEY }}
          NOMINAL_E2E_WORKSPACE_RID: ${{ secrets.E2E_NOMINAL_STAGING_WORKSPACE_RID }}
        run: |
          if [[ -z "${NOMINAL_E2E_TOKEN}" ]]; then
            echo "::error::E2E_NOMINAL_STAGING_API_KEY secret is not configured"
            exit 1
          fi
          uv run nom config profile add staging-e2e \
            --base-url https://api-staging.gov.nominal.io/api \
            --workspace-rid ${NOMINAL_E2E_WORKSPACE_RID} \
            --token ${NOMINAL_E2E_TOKEN} \
            --validate \
            -vv

      - name: Run e2e tests
        run: |
          uv run pytest ${{ matrix.suite.args }} \
            --profile staging-e2e \
            --no-cov \
            --durations=0 --durations-min=0 \
            --junitxml=test-results/e2e.xml \
            -v

      - name: Upload e2e timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-timings-${{ matrix.suite.name }}
          path: test-results/e2e.xml
          if-no-files-found: warn

  e2e-tests:
    name: E2E Tests
    needs: e2e-suites
    if: >-
      always() && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Require all suites to pass
        env:
          RESULT: ${{ needs.e2e-suites.result }}
        run: test "$RESULT" = success

  migration-e2e-tests:
    name: Migration E2E Tests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45

    # Fork PRs don't have access to secrets — skip gracefully.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install dependencies
        run: just install

      - name: Write staging profile
        env:
          NOMINAL_E2E_TOKEN: ${{ secrets.E2E_NOMINAL_STAGING_API_KEY }}
          NOMINAL_E2E_WORKSPACE_RID: ${{ secrets.E2E_NOMINAL_STAGING_WORKSPACE_RID }}
        run: |
          if [[ -z "${NOMINAL_E2E_TOKEN}" ]]; then
            echo "::error::E2E_NOMINAL_STAGING_API_KEY secret is not configured"
            exit 1
          fi
          uv run nom config profile add staging-e2e \
            --base-url https://api-staging.gov.nominal.io/api \
            --workspace-rid ${NOMINAL_E2E_WORKSPACE_RID} \
            --token ${NOMINAL_E2E_TOKEN} \
            --validate \
            -vv

      - name: Write production profile
        env:
          NOMINAL_E2E_TOKEN: ${{ secrets.E2E_NOMINAL_PRODUCTION_API_KEY }}
          NOMINAL_E2E_WORKSPACE_RID: ${{ secrets.E2E_NOMINAL_PRODUCTION_WORKSPACE_RID }}
        run: |
          if [[ -z "${NOMINAL_E2E_TOKEN}" ]]; then
            echo "::error::E2E_NOMINAL_PRODUCTION_API_KEY secret is not configured"
            exit 1
          fi
          uv run nom config profile add production-e2e \
            --base-url https://api.gov.nominal.io/api \
            --workspace-rid ${NOMINAL_E2E_WORKSPACE_RID} \
            --token ${NOMINAL_E2E_TOKEN} \
            --validate \
            -vv

      - name: Run migration e2e tests
        # --fail-on-skip: a skipped migration test is a coverage gap, not a pass — missing
        # prerequisites (e.g. unset impersonation secrets) must fail the job, not hide.
        env:
          # The source side of the impersonation mapping is derived from the source token's
          # own user inside the test; only the destination user RID needs configuring.
          IMPERSONATION_DEST_USER_RID: ${{ secrets.E2E_IMPERSONATION_DEST_USER_RID }}
        run: |
          uv run pytest tests/e2e/migration \
            --dest-profile staging-e2e \
            --source-profile production-e2e \
            --impersonation-dest-user-rid "${IMPERSONATION_DEST_USER_RID}" \
            --fail-on-skip \
            --no-cov \
            --durations=0 --durations-min=0 \
            --junitxml=test-results/migration.xml \
            -v

      - name: Upload migration timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-e2e-timings
          path: test-results/migration.xml
          if-no-files-found: warn

  # Runs the special-character filename tests against each object-store backend. These guard the
  # filename-encoding fix (PR #877): S3 tolerates every character on upload, so it can only catch a
  # stored-name regression, while Azure Blob is where the original SAS bug lived and must be
  # exercised directly. Scope is intentionally narrow — Azure staging's broader e2e suite is flaky
  # (unrelated failures), so only these tests run here; broaden later if that changes.
  file-upload-e2e:
    name: File Upload E2E (${{ matrix.env.name }})
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45

    # Fork PRs don't have access to secrets — skip gracefully.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        env:
          - name: aws
            base_url: https://api-staging.gov.nominal.io/api
            token_secret: E2E_NOMINAL_STAGING_API_KEY
            workspace_secret: E2E_NOMINAL_STAGING_WORKSPACE_RID
          - name: azure
            base_url: https://api-staging.azure.nominal.io/api
            token_secret: E2E_NOMINAL_AZURE_STAGING_API_KEY
            workspace_secret: E2E_NOMINAL_AZURE_STAGING_WORKSPACE_RID

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.x"
          enable-cache: false
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install dependencies
        run: just install

      - name: Write ${{ matrix.env.name }} staging profile
        env:
          NOMINAL_E2E_TOKEN: ${{ secrets[matrix.env.token_secret] }}
          NOMINAL_E2E_WORKSPACE_RID: ${{ secrets[matrix.env.workspace_secret] }}
        run: |
          if [[ -z "${NOMINAL_E2E_TOKEN}" ]]; then
            echo "::error::${{ matrix.env.token_secret }} secret is not configured"
            exit 1
          fi
          uv run nom config profile add file-upload-e2e \
            --base-url ${{ matrix.env.base_url }} \
            --workspace-rid ${NOMINAL_E2E_WORKSPACE_RID} \
            --token ${NOMINAL_E2E_TOKEN} \
            --validate \
            -vv

      - name: Run file upload e2e tests
        run: |
          uv run pytest tests/e2e/test_file_upload.py \
            -n 2 \
            --profile file-upload-e2e \
            --no-cov \
            --durations=0 --durations-min=0 \
            --junitxml=test-results/file-upload.xml \
            -v

      - name: Upload file upload timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-upload-e2e-timings-${{ matrix.env.name }}
          path: test-results/file-upload.xml
          if-no-files-found: warn
