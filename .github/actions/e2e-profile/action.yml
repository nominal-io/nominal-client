name: Create E2E profile
description: Create a one-day API key and configure a profile for this job.
inputs:
  base-url:
    description: API base URL
    required: true
  parent-token:
    description: API key used to create and later revoke the job credential
    required: true
  profile:
    description: Nominal profile name
    required: true
  workspace-rid:
    description: Workspace used by the tests
    required: true
outputs:
  key-rid:
    description: Created API key RID; the caller must revoke it in an always() step
    value: ${{ steps.create.outputs.key-rid }}
runs:
  using: composite
  steps:
    - name: Create temporary credential
      id: create
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        PARENT_TOKEN: ${{ inputs.parent-token }}
        PROFILE: ${{ inputs.profile }}
      run: |
        if [[ -z "$PARENT_TOKEN" ]]; then
          echo "::error::E2E parent API key is not configured"
          exit 1
        fi
        request=$(jq -n \
          --arg name "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${PROFILE}" \
          '{apiKeyName: $name, expiresAfterDays: 1}')
        response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
          -H "Authorization: Bearer $PARENT_TOKEN" -H 'Content-Type: application/json' \
          --data "$request" "$BASE_URL/authorization/v1/api-key")
        key=$(jq -er '.apiKeyValue' <<< "$response")
        echo "::add-mask::$key"
        rid=$(jq -er '.apiKeyMetadata.rid' <<< "$response")
        echo "key-rid=$rid" >> "$GITHUB_OUTPUT"
        echo "token=$key" >> "$GITHUB_OUTPUT"

    - name: Write profile
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        PROFILE: ${{ inputs.profile }}
        WORKSPACE_RID: ${{ inputs.workspace-rid }}
        TOKEN: ${{ steps.create.outputs.token }}
      run: |
        uv run nom config profile add "$PROFILE" \
          --base-url "$BASE_URL" \
          --workspace-rid "$WORKSPACE_RID" \
          --token "$TOKEN" \
          --validate
