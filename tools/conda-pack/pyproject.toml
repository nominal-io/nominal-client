[project]
name = "nominal-conda-pack"
version = "0.1.0"
description = "Offline Conda environment builder"
readme = "README.md"
authors = [
    { name = "Tarun Prakash", email = "tarun.prakash@nominal.io" }
]
requires-python = ">=3.12"
dependencies = [
    "conda-pack>=0.9.2",
]

[project.scripts]
nominal-bundle = "nominal_conda_pack:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
managed = true

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/resources/smoke.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["nominal_conda_pack"]
