[project]
name = "nominal-io-wfdb"
version = "0.1.0"
description = "PhysioNet WFDB records (ECGs and other physiological signals) for nominal.io in the Nominal Python client"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = { text = "PhysioNet WFDB records (ECGs and other physiological signals) for nominal.io in the Nominal Python client.", content-type = "text/markdown" }
requires-python = ">=3.11,<4"
dependencies = ["nominal>=1.182.0", "wfdb>=4.1"]

[project.urls]
Homepage = "https://nominal.io"
Documentation = "https://docs.nominal.io"
Repository = "https://github.com/nominal-io/nominal-client"

[project.entry-points."nominal.io.readers"]
wfdb = "nominal.io_wfdb:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "NOTICE", "nominal/io_wfdb/**"]

[tool.hatch.build.targets.wheel]
include = ["LICENSE", "NOTICE", "nominal/io_wfdb/**"]
