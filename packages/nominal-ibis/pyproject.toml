[project]
name = "nominal-ibis"
version = "0.1.0"
description = "Ibis backend for the Nominal SQL API"
authors = [
    { name = "Sahil Gupta", email = "sahil.gupta@nominal.io" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = { text = "Ibis backend for the Nominal Python client.", content-type = "text/markdown" }
requires-python = ">=3.10,<4"
dependencies = [
    "nominal>=1.164.0",
    "ibis-framework>=12,<13",
    "pyarrow>=14",
    # ibis-framework's base distribution imports these at runtime (ibis.formats.pyarrow
    # and the SQL compiler registry) but only declares them in its per-backend extras,
    # so they must be pinned here for a bare `nominal[ibis]` install to import.
    "pyarrow-hotfix>=0.4",
    "packaging>=23.0",
]

[project.entry-points."ibis.backends"]
nominal = "nominal.ibis"

[project.urls]
Homepage = "https://nominal.io"
Documentation = "https://docs.nominal.io"
Repository = "https://github.com/nominal-io/nominal-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "NOTICE", "nominal/ibis/**"]

[tool.hatch.build.targets.wheel]
include = ["LICENSE", "NOTICE", "nominal/ibis/**"]
