# Keep the card icon and leave out version stamps when Jupytext rewrites a notebook's front matter.
# `format_name: myst` stays in the front matter: MyST-NB runs an .md file as a notebook only when it's there.
notebook_metadata_filter = "icon,-jupytext.text_representation.jupytext_version,-jupytext.text_representation.format_version,-jupytext.text_representation.extension"
# Read and save these .md files as MyST notebooks, since the filter above leaves the format out of their front matter.
preferred_jupytext_formats_read = "md:myst"
preferred_jupytext_formats_save = "md:myst"
# Leave out the cell metadata JupyterLab adds on save.
cell_metadata_filter = "-editable,-deletable,-slideshow"
